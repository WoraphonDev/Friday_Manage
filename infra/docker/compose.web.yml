name: friday-web

services:
  web:
    image: friday-manage-web:local
    build:
      context: ../..
      dockerfile: Dockerfile.web
      args:
        API_ORIGIN: ${WEB_API_ORIGIN:-http://host.docker.internal:3001}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
