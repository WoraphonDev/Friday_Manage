name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: friday_owner
          POSTGRES_PASSWORD: friday_owner_dev
          POSTGRES_DB: friday
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U friday_owner -d friday"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_OWNER_URL: postgres://friday_owner:friday_owner_dev@localhost:54329/friday
      DATABASE_APP_URL: postgres://friday_api:friday_api_dev@localhost:54329/friday
      DATABASE_SYSTEM_URL: postgres://friday_worker:friday_worker_dev@localhost:54329/friday

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm from packageManager
        uses: pnpm/action-setup@v6

      - name: Set up Node.js and dependency cache
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Set up database roles
        run: pnpm db:dev-roles

      - name: Typecheck all packages
        run: pnpm typecheck

      - name: Test all packages in sequence
        run: pnpm test

      - name: Build all packages with a build script
        run: pnpm -r --if-present build
