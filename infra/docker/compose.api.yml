name: friday-api

# API ลูกค้า (apps/api) ใน Docker บนเครื่อง · แทน `node dist/main.js` ที่พอร์ต 3001 · ใช้ฐานข้อมูล QA เดิม (ไม่ล้าง ไม่ reseed)
# ดูวิธีใช้ใน infra/docker/api.md
services:
  api:
    image: friday-manage-api:local
    build:
      context: ../..
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # ยังไม่มี Gateway จริง (A35b) และ secret ของ production · ใช้โหมดพัฒนา (ตัวจำลองการชำระเงิน + secret dev เดิม จึงใช้ session เดิมต่อได้)
      NODE_ENV: ${API_NODE_ENV:-development}
      DATABASE_APP_URL: ${API_DATABASE_APP_URL:-postgres://friday_api:friday_api_dev@host.docker.internal:54329/friday_canvas_qa}
      DATABASE_SYSTEM_URL: ${API_DATABASE_SYSTEM_URL:-postgres://friday_worker:friday_worker_dev@host.docker.internal:54329/friday_canvas_qa}
      APP_URL: ${APP_URL:-http://localhost:3000}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      REALTIME_ALLOWED_ORIGINS: ${REALTIME_ALLOWED_ORIGINS:-http://localhost:3000}
      UPLOAD_DIR: /data/uploads
      # ไม่ตั้ง VALKEY_URL = คิวทำงานใน process เดียวกับ API (เหมือนตอนรันบนเครื่อง)
      VALKEY_URL: ${API_VALKEY_URL:-}
      # O36: Webhook ของโปรเจกต์ FM ส่งเข้า ops-api ในเครื่อง (host.docker.internal:4001) ซึ่งเป็นที่อยู่ภายใน · ปิดด้วย API_WEBHOOK_ALLOW_PRIVATE=0
      WEBHOOK_ALLOW_PRIVATE: ${API_WEBHOOK_ALLOW_PRIVATE:-1}
    volumes:
      # ไฟล์ที่ลูกค้าอัปโหลดเดิม (ops-api อ่านที่เดียวกันแบบอ่านอย่างเดียว)
      - ../../apps/api/var/uploads:/data/uploads
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
