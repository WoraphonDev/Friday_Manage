# ฐานข้อมูลสำหรับพัฒนาในเครื่องเท่านั้น
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: friday_owner
      POSTGRES_PASSWORD: friday_owner_dev
      POSTGRES_DB: friday
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friday_owner -d friday"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
